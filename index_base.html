<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود | سامانه بازدید فروشگاهی دیلی‌مارکت</title>
  <meta name="theme-color" content="#8b0014" />
  <style>
    @font-face {
      font-family: "Vazir";
      src: url("https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/Vazir.woff2") format("woff2"),
           url("https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/Vazir.woff") format("woff");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Vazir";
      src: url("https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/Vazir-Bold.woff2") format("woff2"),
           url("https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/Vazir-Bold.woff") format("woff");
      font-weight: bold;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg-1:#050816;
      --bg-2:#0d1226;
      --card:#140b12;
      --card-2:#1d1118;
      --line:rgba(255,255,255,.08);
      --text:#f7f7fa;
      --muted:#b8bdc9;
      --accent:#d6001c;
      --accent-2:#ff2f45;
      --accent-3:#8a0012;
      --field:#2a2f3d;
      --field-focus:#343a4a;
      --shadow:0 24px 80px rgba(0,0,0,.45);
      --radius-xl:34px;
      --radius-lg:22px;
      --radius-md:16px;
      --radius-sm:12px;
    }

    * { box-sizing: border-box; }
    html,body { height:100%; }
    body {
      margin:0;
      font-family: "Vazir", Tahoma, Arial, "Segoe UI", sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 50% 32%, rgba(214,0,28,.38), rgba(214,0,28,0) 28%),
        radial-gradient(circle at 50% 80%, rgba(120,8,24,.22), rgba(120,8,24,0) 32%),
        linear-gradient(180deg, #020617 0%, #080d1f 45%, #040815 100%);
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    .ambient {
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.9;
      background:
        radial-gradient(ellipse at center, rgba(255,24,55,.10) 0%, rgba(255,24,55,0) 40%),
        radial-gradient(ellipse at top, rgba(255,0,34,.08) 0%, rgba(255,0,34,0) 36%);
      filter: blur(16px);
    }

    .shell {
      width:min(100%, 430px);
      padding:24px;
    }

    .phone-frame {
      background:#020307;
      border-radius:42px;
      padding:14px;
      box-shadow: 0 26px 70px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.03);
      position:relative;
    }

    .notch {
      position:absolute;
      top:12px;
      left:50%;
      transform:translateX(-50%);
      width:122px;
      height:24px;
      border-radius:0 0 18px 18px;
      background:#020307;
      z-index:4;
      box-shadow:0 1px 0 rgba(255,255,255,.03);
    }

    .screen {
      min-height:760px;
      border-radius:34px;
      position:relative;
      overflow:hidden;
      background:
        linear-gradient(180deg, #b40017 0%, #d6001c 22%, #8b0014 58%, #120910 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
      padding:72px 28px 28px;
    }

    .screen::before {
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 10%, rgba(255,255,255,.12), transparent 23%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0) 28%);
      pointer-events:none;
    }

    .header {
      text-align:center;
      margin-top:8px;
      position:relative;
      z-index:1;
    }

    .logo-wrap {
      width:min(88%, 280px);
      margin:0 auto 10px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .logo {
      display:block;
      width:100%;
      height:auto;
      object-fit:contain;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,.20));
    }

    .product-name {
      margin:14px 0 0;
      font-weight:800;
      font-size:1.18rem;
      letter-spacing:0;
    }

    .product-subtitle {
      margin:8px auto 0;
      max-width:270px;
      color:rgba(255,255,255,.82);
      font-size:.88rem;
      line-height:1.8;
    }

    .form-panel {
      margin-top:68px;
      padding:0 4px;
      position:relative;
      z-index:1;
    }

    .welcome {
      text-align:center;
      margin-bottom:26px;
    }

    .welcome h2 {
      margin:0;
      font-size:1.62rem;
      font-weight:800;
    }

    .welcome p {
      margin:10px 0 0;
      color:rgba(255,255,255,.85);
      font-size:.92rem;
    }

    form { display:grid; gap:16px; }

    .field {
      position:relative;
      background:rgba(26,32,45,.92);
      border:1px solid rgba(255,255,255,.06);
      border-radius:999px;
      min-height:60px;
      display:flex;
      align-items:center;
      transition: .2s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.02);
    }

    .field:focus-within {
      background:rgba(36,42,56,.98);
      border-color:rgba(255,255,255,.13);
      transform:translateY(-1px);
    }

    .field svg {
      width:20px; height:20px;
      margin:0 16px 0 10px;
      fill:none;
      stroke:#bfc5d1;
      stroke-width:1.8;
      flex:0 0 auto;
    }

    .field input {
      width:100%;
      min-width:0;
      background:transparent;
      border:none;
      outline:none;
      color:#fff;
      font-size:.98rem;
      font-family:inherit;
      padding:18px 0 18px 16px;
      text-align:right;
    }

    .field input::placeholder { color:#adb4c1; }

    .toggle-password {
      border:none;
      background:transparent;
      color:#d9dce3;
      cursor:pointer;
      padding:10px 16px;
      font-size:.82rem;
      font-family:inherit;
    }

    .meta-row {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-top:-2px;
      color:#f4f4f4;
      font-size:.82rem;
    }

    .meta-row-single {
      justify-content:flex-start;
    }

    .remember {
      display:flex;
      align-items:center;
      gap:8px;
      color:rgba(255,255,255,.82);
    }

    .remember input { accent-color:#fff; }

    .help-link {
      color:#fff;
      text-decoration:none;
      opacity:.88;
    }

    .help-link:hover { opacity:1; text-decoration:underline; }

    .submit-btn {
      margin-top:8px;
      border:none;
      border-radius:999px;
      min-height:58px;
      font-size:1rem;
      font-weight:800;
      cursor:pointer;
      font-family:inherit;
      color:#fff;
      background:linear-gradient(180deg, #ff1800 0%, #f40000 28%, #d60000 100%);
      box-shadow:0 16px 28px rgba(101,0,0,.34), inset 0 1px 0 rgba(255,255,255,.18);
      transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    .submit-btn:hover {
      transform:translateY(-2px);
      box-shadow:0 22px 32px rgba(101,0,0,.42), inset 0 1px 0 rgba(255,255,255,.18);
      filter:brightness(1.04);
    }

    .submit-btn:active { transform:translateY(0); }

    .submit-btn[disabled] { opacity:.65; cursor:not-allowed; transform:none; }

    .footer-note {
      text-align:center;
      margin-top:20px;
      color:rgba(255,255,255,.86);
      font-size:.8rem;
      line-height:1.8;
    }

    .footer-note strong { color:#fff; }

    .status-box {
      min-height:24px;
      margin-top:12px;
      text-align:center;
      font-size:.84rem;
      font-weight:700;
      color:#fff;
    }

    .status-box.error { color:#ffe2e6; }
    .status-box.success { color:#d8ffe4; }

    .glow-ring {
      position:absolute;
      inset:auto 18px 16px 18px;
      height:120px;
      background:radial-gradient(circle at 50% 0%, rgba(255,50,77,.18), rgba(255,50,77,0) 70%);
      pointer-events:none;
      filter:blur(24px);
    }

    @media (max-width: 520px) {
      .shell { width:100%; padding:10px; }
      .phone-frame { border-radius:30px; padding:10px; }
      .screen { min-height:100dvh; border-radius:24px; padding:68px 20px 24px; }
      body { display:block; }
    }
  </style>
</head>

          <div class="product-name">چک لیست</div>
        </div>

        <div class="form-panel">
          <div class="welcome">
            <h2>خوش آمدید</h2>
            <p>برای ادامه، کد کاربری و رمز عبور خود را وارد کنید</p>
          </div>

          <form id="loginForm" novalidate>
            <label class="field" aria-label="کد کاربری">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 21a8 8 0 0 0-16 0"></path>
                <circle cx="12" cy="8" r="4"></circle>
              </svg>
              <input id="username" name="username" type="text" inputmode="numeric" autocomplete="username" placeholder="کد کاربری" required />
            </label>

            <label class="field" aria-label="رمز عبور">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
              </svg>
              <input id="password" name="password" type="password" inputmode="numeric" autocomplete="current-password" placeholder="رمز عبور" required />
              <button class="toggle-password" type="button" id="togglePassword">نمایش</button>
            </label>

            <div class="meta-row meta-row-single">
              <label class="remember"><input type="checkbox" id="rememberMe" /> مرا به خاطر بسپار</label>
            </div>

            <button class="submit-btn" id="submitBtn" type="submit">ورود به سامانه</button>

            <div class="status-box" id="statusBox"></div>
          </form>

          <div class="footer-note">
            نسخه اولیه سامانه مدیریت بازدید فروشگاهی <strong>دیلی‌مارکت</strong>
          </div>
        </div>

        <div class="glow-ring"></div>
      </section>
    </div>
  </main>

  <script>
    const CONFIG = {
      API_BASE_URL: '', // آدرس Web App گوگل اپس اسکریپت در مرحله بعد اینجا قرار می‌گیرد
      DEMO_MODE: true
    };

    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const rememberMeInput = document.getElementById('rememberMe');
    const statusBox = document.getElementById('statusBox');
    const submitBtn = document.getElementById('submitBtn');
    const togglePasswordBtn = document.getElementById('togglePassword');

    const demoUsers = {
      '10001': { password: '50001', role: 'executive', name: 'مدیر اجرایی', redirect: 'executive-dashboard.html' },
      '20001': { password: '60001', role: 'regional', name: 'مدیر منطقه', redirect: 'regional-dashboard.html' },
      '30001': { password: '70001', role: 'areahead', name: 'رئیس ناحیه', redirect: 'areahead-dashboard.html' }
    };

    function setStatus(message = '', type = '') {
      statusBox.textContent = message;
      statusBox.className = 'status-box' + (type ? ' ' + type : '');
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.textContent = isLoading ? 'در حال بررسی...' : 'ورود به سامانه';
    }

    function saveRememberedUser() {
      if (rememberMeInput.checked) {
        localStorage.setItem('dmRememberedUsername', usernameInput.value.trim());
      } else {
        localStorage.removeItem('dmRememberedUsername');
      }
    }

    function loadRememberedUser() {
      const remembered = localStorage.getItem('dmRememberedUsername');
      if (remembered) {
        usernameInput.value = remembered;
        rememberMeInput.checked = true;
      }
    }

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      togglePasswordBtn.textContent = isPassword ? 'پنهان' : 'نمایش';
    });

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      setStatus('');

      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!username || !password) {
        setStatus('لطفاً کد کاربری و رمز عبور را وارد کنید.', 'error');
        return;
      }

      setLoading(true);

      try {
        if (CONFIG.DEMO_MODE) {
          await new Promise(resolve => setTimeout(resolve, 700));
          const user = demoUsers[username];
          if (!user || user.password !== password) {
            throw new Error('کد کاربری یا رمز عبور صحیح نیست.');
          }

          saveRememberedUser();
          localStorage.setItem('dmCurrentUser', JSON.stringify({
            username,
            role: user.role,
            name: user.name,
            loginAt: new Date().toISOString()
          }));

          setStatus(`ورود موفق بود. در حال انتقال به پنل ${user.name}...`, 'success');

          setTimeout(() => {
            window.location.href = user.redirect;
          }, 900);
          return;
        }

        if (!CONFIG.API_BASE_URL) {
          throw new Error('آدرس سرویس لاگین هنوز تنظیم نشده است.');
        }

        const response = await fetch(CONFIG.API_BASE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'login',
            username,
            password
          })
        });

        if (!response.ok) {
          throw new Error('ارتباط با سرور برقرار نشد.');
        }

        const result = await response.json();

        if (!result.success) {
          throw new Error(result.message || 'ورود ناموفق بود.');
        }

        saveRememberedUser();
        localStorage.setItem('dmCurrentUser', JSON.stringify(result.user));
        setStatus('ورود موفق بود. در حال انتقال...', 'success');

        setTimeout(() => {
          switch (result.user.role) {
            case 'executive':
              window.location.href = 'executive-dashboard.html';
              break;
            case 'regional':
              window.location.href = 'regional-dashboard.html';
              break;
            case 'areahead':
              window.location.href = 'areahead-dashboard.html';
              break;
            default:
              window.location.href = 'dashboard.html';
          }
        }, 800);
      } catch (error) {
        setStatus(error.message || 'خطا در ورود به سامانه', 'error');
      } finally {
        setLoading(false);
      }
    });

    loadRememberedUser();
  </script>
</body>
</html>
