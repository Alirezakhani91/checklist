<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>چک لیست | دیلی‌مارکت</title>
  <meta name="theme-color" content="#870015" />
  <style>
    @font-face {
      font-family:"Vazir";
      src:url("https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/Vazir.woff2") format("woff2");
      font-weight:400;
      font-style:normal;
      font-display:swap;
    }
    @font-face {
      font-family:"Vazir";
      src:url("https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/Vazir-Bold.woff2") format("woff2");
      font-weight:700 900;
      font-style:normal;
      font-display:swap;
    }

    :root {
      --red:#d3001e;
      --red-deep:#820012;
      --red-dark:#4e000c;
      --ink:#070a13;
      --panel:#0d111c;
      --field:#171c29;
      --field-hover:#1d2332;
      --text:#f8f9fc;
      --muted:#aeb5c4;
      --line:rgba(255,255,255,.09);
      --danger:#ffd7dd;
      --success:#caffd8;
      --shadow:0 28px 90px rgba(0,0,0,.38);
    }

    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      font-family:"Vazir",Tahoma,Arial,sans-serif;
      background:#05070d;
      color:var(--text);
      overflow-x:hidden;
    }
    button,input{font:inherit}

    .page{
      min-height:100dvh;
      position:relative;
      display:grid;
      isolation:isolate;
      background:
        radial-gradient(circle at 12% 15%, rgba(211,0,30,.16), transparent 28%),
        radial-gradient(circle at 85% 78%, rgba(114,0,18,.18), transparent 34%),
        linear-gradient(135deg,#05070d 0%,#090d18 48%,#060810 100%);
    }

    .page::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
      background-size:44px 44px;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 88%);
      z-index:-1;
    }

    .desktop-shell{
      width:100%;
      min-height:100dvh;
      display:grid;
      grid-template-columns:minmax(430px,42%) minmax(0,58%);
    }

    .auth-side{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(34px,5vw,78px);
      background:linear-gradient(180deg,rgba(7,10,19,.96),rgba(7,10,19,.88));
      border-left:1px solid var(--line);
      position:relative;
      z-index:2;
    }

    .auth-wrap{width:min(100%,470px)}

    .mobile-brand{display:none}

    .eyebrow{
      width:max-content;
      margin:0 0 20px auto;
      padding:8px 12px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:999px;
      color:#c8cedb;
      font-size:.78rem;
      background:rgba(255,255,255,.025);
    }

    .welcome{margin-bottom:34px}
    .welcome h1{
      margin:0;
      font-size:clamp(2rem,3vw,2.8rem);
      font-weight:900;
      letter-spacing:-.04em;
    }
    .welcome p{
      margin:12px 0 0;
      color:var(--muted);
      font-size:.98rem;
      line-height:1.9;
    }

    form{display:grid;gap:16px}
    .field-group{display:grid;gap:8px}
    .field-title{font-size:.82rem;color:#d9ddea;padding-inline:4px}
    .field{
      min-height:62px;
      display:flex;
      align-items:center;
      border-radius:18px;
      border:1px solid var(--line);
      background:var(--field);
      overflow:hidden;
      transition:.2s ease;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
    }
    .field:hover{background:var(--field-hover)}
    .field:focus-within{
      border-color:rgba(255,40,69,.55);
      box-shadow:0 0 0 4px rgba(211,0,30,.10),inset 0 1px 0 rgba(255,255,255,.025);
      background:#1b2030;
    }
    .field svg{
      width:20px;height:20px;flex:0 0 auto;
      margin-inline:17px 8px;
      stroke:#aeb6c7;fill:none;stroke-width:1.8;
    }
    .field input{
      width:100%;min-width:0;
      border:0;outline:0;background:transparent;color:#fff;
      padding:18px 10px 18px 18px;
      text-align:right;
      font-size:.98rem;
    }
    .field input::placeholder{color:#7f889b}
    .toggle-password{
      border:0;background:transparent;color:#bfc6d4;cursor:pointer;
      padding:10px 18px;white-space:nowrap;font-size:.8rem;
    }

    .meta-row{display:flex;align-items:center;justify-content:flex-start;min-height:26px;margin-top:2px}
    .remember{display:flex;align-items:center;gap:9px;color:#b6bdcb;font-size:.83rem;cursor:pointer}
    .remember input{width:16px;height:16px;accent-color:var(--red)}

    .submit-btn{
      margin-top:6px;
      min-height:60px;
      border:0;border-radius:18px;
      color:#fff;font-weight:800;font-size:1rem;cursor:pointer;
      background:linear-gradient(135deg,#f10828 0%,#d3001e 45%,#a90018 100%);
      box-shadow:0 18px 36px rgba(176,0,24,.24),inset 0 1px 0 rgba(255,255,255,.22);
      transition:transform .2s ease,filter .2s ease,box-shadow .2s ease;
    }
    .submit-btn:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 22px 42px rgba(176,0,24,.31)}
    .submit-btn:active{transform:translateY(0)}
    .submit-btn:disabled{opacity:.62;cursor:not-allowed;transform:none}

    .status-box{min-height:26px;text-align:center;font-size:.84rem;font-weight:700;padding-top:2px}
    .status-box.error{color:var(--danger)}
    .status-box.success{color:var(--success)}

    .brand-side{
      position:relative;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:64px;
      background:
        radial-gradient(circle at 50% 28%,rgba(255,255,255,.13),transparent 26%),
        radial-gradient(circle at 16% 78%,rgba(255,84,103,.18),transparent 28%),
        linear-gradient(145deg,#ed001f 0%,#b50019 44%,#760010 100%);
    }
    .brand-side::before{
      content:"";
      position:absolute;
      width:min(74vw,860px);aspect-ratio:1;
      border:1px solid rgba(255,255,255,.10);
      border-radius:50%;
      right:-34%;top:-22%;
      box-shadow:0 0 0 90px rgba(255,255,255,.018),0 0 0 180px rgba(255,255,255,.014);
    }
    .brand-side::after{
      content:"";
      position:absolute;
      inset:auto 8% 7% 8%;
      height:140px;
      background:radial-gradient(ellipse,rgba(0,0,0,.34),transparent 67%);
      filter:blur(18px);
    }

    .brand-content{
      width:min(90%,720px);
      text-align:center;
      position:relative;
      z-index:1;
      transform:translateY(-1vh);
    }
    .brand-logo{
      display:block;
      width:min(100%,620px);
      height:auto;
      margin:0 auto;
      filter:drop-shadow(0 18px 30px rgba(65,0,9,.20));
    }
    .brand-label{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-top:28px;
      padding:10px 20px;
      min-width:130px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.22);
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(10px);
      color:#fff;
      font-size:1.04rem;
      font-weight:700;
      box-shadow:0 12px 30px rgba(60,0,8,.16);
    }

    .mini-dots{
      position:absolute;left:48px;bottom:46px;display:grid;grid-template-columns:repeat(3,6px);gap:8px;opacity:.42
    }
    .mini-dots i{width:6px;height:6px;border-radius:50%;background:#fff;display:block}

    @media (max-width: 899px) {
      body{background:#070a13}
      .desktop-shell{display:block;min-height:100dvh}
      .brand-side{display:none}
      .auth-side{
        min-height:100dvh;
        padding:max(22px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));
        border:0;
        background:
          radial-gradient(circle at 50% 4%,rgba(255,20,51,.22),transparent 25%),
          linear-gradient(180deg,#820012 0%,#b10018 25%,#160911 55%,#080b14 100%);
        align-items:flex-start;
      }
      .auth-wrap{width:min(100%,520px);margin:0 auto;padding-top:22px}
      .mobile-brand{display:block;text-align:center;margin-bottom:54px}
      .mobile-brand .brand-logo{width:min(84%,360px)}
      .mobile-brand .brand-label{margin-top:14px;padding:7px 16px;font-size:.94rem;background:rgba(0,0,0,.10)}
      .eyebrow{display:none}
      .welcome{text-align:center;margin-bottom:28px}
      .welcome h1{font-size:1.72rem;letter-spacing:0}
      .welcome p{font-size:.9rem;line-height:1.8;color:#c0c5d0}
      .field-title{display:none}
      .field{border-radius:999px;min-height:58px;background:rgba(27,31,43,.96)}
      .submit-btn{border-radius:999px;min-height:58px}
      .meta-row{padding-inline:6px}
    }

    @media (max-width: 380px) {
      .auth-side{padding-inline:14px}
      .auth-wrap{padding-top:14px}
      .mobile-brand{margin-bottom:40px}
      .welcome h1{font-size:1.52rem}
      .field{min-height:55px}
      .submit-btn{min-height:55px}
    }

    @media (min-width: 900px) and (max-height: 720px) {
      .auth-side{padding-block:28px}
      .welcome{margin-bottom:24px}
      .brand-logo{width:min(92%,540px)}
    }
  </style>
</head>

  <iframe name="dmAuthFrame" id="dmAuthFrame" title="auth" style="display:none"></iframe>
  <script src="app-config.js"></script>
  <script src="auth-client.js"></script>

  <script>
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const rememberMeInput = document.getElementById('rememberMe');
    const statusBox = document.getElementById('statusBox');
    const submitBtn = document.getElementById('submitBtn');
    const togglePasswordBtn = document.getElementById('togglePassword');

    let loginTimer = null;

    function setStatus(message = '', type = '') {
      statusBox.textContent = message;
      statusBox.className = 'status-box' + (type ? ' ' + type : '');
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.textContent = isLoading ? 'در حال بررسی...' : 'ورود به سامانه';
    }

    function normalizeDigits(value) {
      return String(value || '')
        .replace(/[۰-۹]/g, d => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))
        .replace(/[٠-٩]/g, d => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)))
        .trim();
    }

    function saveRememberedUser() {
      if (rememberMeInput.checked) {
        localStorage.setItem('dmRememberedUsername', usernameInput.value.trim());
      } else {
        localStorage.removeItem('dmRememberedUsername');
      }
    }

    function loadRememberedUser() {
      const remembered = localStorage.getItem('dmRememberedUsername');
      if (remembered) {
        usernameInput.value = remembered;
        rememberMeInput.checked = true;
        passwordInput.focus();
      }
    }

    function submitToAppsScript(username, password) {
      const url = window.DM_CONFIG && window.DM_CONFIG.APPS_SCRIPT_URL;
      if (!url || url.includes('PASTE_YOUR')) {
        throw new Error('آدرس Apps Script هنوز تنظیم نشده است.');
      }

      const bridge = document.createElement('form');
      bridge.method = 'POST';
      bridge.action = url;
      bridge.target = 'dmAuthFrame';
      bridge.style.display = 'none';

      const payload = {
        action: 'login',
        username,
        password,
        userAgent: navigator.userAgent
      };

      Object.entries(payload).forEach(([name, value]) => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = name;
        input.value = value;
        bridge.appendChild(input);
      });

      document.body.appendChild(bridge);
      bridge.submit();
      setTimeout(() => bridge.remove(), 1000);
    }

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePasswordBtn.textContent = isPassword ? 'پنهان' : 'نمایش';
    });

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || data.source !== 'DM_AUTH') return;

      if (loginTimer) clearTimeout(loginTimer);
      setLoading(false);

      if (!data.success) {
        setStatus(data.message || 'ورود ناموفق بود.', 'error');
        passwordInput.select();
        return;
      }

      saveRememberedUser();
      DMAuth.saveAuth(data);
      setStatus(`خوش آمدید ${data.user.fullName}. در حال ورود...`, 'success');
      setTimeout(() => {
        location.href = data.redirect || 'index.html';
      }, 650);
    });

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      setStatus('');

      const username = normalizeDigits(usernameInput.value);
      const password = normalizeDigits(passwordInput.value);
      usernameInput.value = username;
      passwordInput.value = password;

      if (!username || !password) {
        setStatus('لطفاً کد کاربری و رمز عبور را وارد کنید.', 'error');
        return;
      }

      try {
        setLoading(true);
        submitToAppsScript(username, password);
        loginTimer = setTimeout(() => {
          setLoading(false);
          setStatus('پاسخی از سرور دریافت نشد. اتصال اینترنت یا Deploy را بررسی کنید.', 'error');
        }, 16000);
      } catch (error) {
        setLoading(false);
        setStatus(error.message || 'خطا در اتصال به سامانه', 'error');
      }
    });

    loadRememberedUser();
  </script>
</body>
