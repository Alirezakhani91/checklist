<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#8f0017">
  <title>بازیابی امن پایلوت چک‌لیست</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080c15;color:#fff;
      font-family:Tahoma,Arial,sans-serif;padding:22px}
    .card{width:min(520px,100%);background:#111827;border:1px solid rgba(255,255,255,.1);
      border-radius:24px;padding:28px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.13);border-top-color:#d90025;
      border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    h1{font-size:1.15rem;margin:0 0 9px} p{margin:0;color:#bac2d1;line-height:1.9;font-size:.88rem}
    .small{margin-top:12px;font-size:.72rem;color:#7f8a9e}
  </style>
</head>
<body>
  <div class="card">
    <div class="spin"></div>
    <h1>در حال بازیابی امن پلتفرم…</h1>
    <p>Cache و Service Worker قدیمی مربوط به Checklist پاک می‌شود. Session و اطلاعات ورود شما حذف نمی‌شود.</p>
    <div class="small">Build: 2026.11.11-PILOT-01</div>
  </div>
  <script src="dm-runtime.js?v=2026.11.11-PILOT-01"></script>
  <script>
    (async function(){
      try {
        if (window.DMRuntime) {
          await DMRuntime.repair({reason:'pilot-recovery-page',reload:false});
        }
      } catch (_) {}
      setTimeout(function(){
        location.replace('pilot-login.html?dmrepair=' + Date.now() + '&dmbuild=2026.11.11-PILOT-01');
      },900);
    })();
  </script>
</body>
</html>
