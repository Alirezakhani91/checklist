<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daily Market - Final Login Validation</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Tahoma,Arial,sans-serif;background:#f4f6f9;color:#151922;padding:20px}
    .card{width:min(560px,100%);background:#fff;border:1px solid #e1e6ee;border-radius:24px;padding:28px;box-shadow:0 18px 60px rgba(24,33,50,.10)}
    h1{margin:0 0 8px;font-size:1.35rem}
    .sub{color:#687184;font-size:.88rem;line-height:1.9;margin-bottom:24px}
    label{display:block;font-size:.82rem;font-weight:800;margin:14px 0 7px}
    input{width:100%;height:50px;border:1px solid #d9dee7;border-radius:14px;padding:0 14px;font:inherit;font-size:1rem;outline:none}
    button{width:100%;height:52px;border:0;border-radius:14px;margin-top:20px;background:#c50024;color:#fff;font:inherit;font-weight:900;font-size:1rem;cursor:pointer}
    button:disabled{opacity:.55}
    .status{margin-top:18px;border-radius:14px;padding:14px 16px;background:#f5f6f8;color:#5e6674;font-size:.85rem;line-height:1.8}
    .status.ok{background:#effaf4;color:#147343}
    .status.err{background:#fff0f2;color:#a30e27}
    .grid{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .box{background:#f7f8fa;border:1px solid #e6e9ef;border-radius:14px;padding:12px}
    .k{font-size:.7rem;color:#7c8493} .v{font-size:1.05rem;font-weight:900;margin-top:4px}
    code{direction:ltr;display:block;overflow:auto;font-size:.72rem;margin-top:16px;background:#111827;color:#e5e7eb;padding:12px;border-radius:12px;white-space:pre-wrap}
    iframe{display:none}
  </style>
</head>
<body>
<div class="card">
  <h1>اعتبارسنجی نهایی Login</h1>
  <div class="sub">فقط به Deployment تستی نهایی متصل است. هیچ Redirect انجام نمی‌شود.</div>

  <form id="f">
    <label>کد کاربری</label>
    <input id="u" autocomplete="username">
    <label>رمز عبور</label>
    <input id="p" type="password" autocomplete="current-password">
    <button id="b" type="submit">تست ورود</button>
  </form>

  <div id="s" class="status">آماده تست.</div>

  <div class="grid">
    <div class="box"><div class="k">زمان پاسخ</div><div class="v" id="ms">—</div></div>
    <div class="box"><div class="k">نتیجه</div><div class="v" id="r">—</div></div>
  </div>

  <code id="d">Test URL: https://script.google.com/macros/s/AKfycbw211nwCozxyIwXRu-Ei4ogFAVntXcFCqw1rc47OkVq8rDoMsVXsKJ2uRvVNeSFzyw_/exec</code>
  <iframe name="frame"></iframe>
</div>

<script>
(() => {
  const URL = 'https://script.google.com/macros/s/AKfycbw211nwCozxyIwXRu-Ei4ogFAVntXcFCqw1rc47OkVq8rDoMsVXsKJ2uRvVNeSFzyw_/exec';
  let t0 = 0, timer = null;
  const b = document.getElementById('b');
  const s = document.getElementById('s');

  function submit(username,password) {
    const f=document.createElement('form');
    f.method='POST'; f.action=URL; f.target='frame'; f.style.display='none';
    const payload={action:'login',username,password,userAgent:navigator.userAgent};
    Object.entries(payload).forEach(([k,v])=>{
      const i=document.createElement('input');
      i.type='hidden'; i.name=k; i.value=v; f.appendChild(i);
    });
    document.body.appendChild(f); f.submit(); setTimeout(()=>f.remove(),1000);
  }

  window.addEventListener('message',e=>{
    const data=e.data;
    if(!data || data.source!=='DM_AUTH') return;
    clearTimeout(timer);
    const ms=Math.round(performance.now()-t0);
    document.getElementById('ms').textContent=ms.toLocaleString('fa-IR')+' ms';
    document.getElementById('r').textContent=data.code|| (data.success?'OK':'FAILED');
    b.disabled=false;

    if(data.success){
      s.className='status ok';
      s.textContent='ورود تستی موفق بود.';
    } else {
      s.className='status err';
      s.textContent=data.message||'ورود ناموفق بود.';
    }

    document.getElementById('d').textContent=
      'code: '+(data.code||'')+
      '\nrole: '+(data.user?.role||'')+
      '\nredirect: '+(data.redirect||'')+
      '\nresponseMs: '+ms;
  });

  document.getElementById('f').addEventListener('submit',e=>{
    e.preventDefault();
    const u=document.getElementById('u').value.trim();
    const p=document.getElementById('p').value;
    if(!u||!p)return;
    b.disabled=true;
    s.className='status';
    s.textContent='در حال تست Login نهایی...';
    document.getElementById('r').textContent='WAITING';
    document.getElementById('ms').textContent='...';
    t0=performance.now();
    submit(u,p);
    clearTimeout(timer);
    timer=setTimeout(()=>{
      b.disabled=false;
      const ms=Math.round(performance.now()-t0);
      document.getElementById('ms').textContent=ms.toLocaleString('fa-IR')+' ms';
      document.getElementById('r').textContent='TIMEOUT';
      s.className='status err';
      s.textContent='تا ۲۰ ثانیه پاسخ Login نرسید.';
    },20000);
  });
})();
</script>
</body>
</html>
